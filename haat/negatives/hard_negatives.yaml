# ---------------------------------------------------------------------------
# The second batch, written after the first version of the sentinel scored 0%
# false positives and that looked too easy. Each of these is aimed at a rule
# that had just been given a heavy weight, and every one of them is something a
# real customer or seller says. They are the reason the report prints a margin:
# several of these land within one signal of the threshold, and "we never fire on
# honest text" means much less when the nearest miss is 45 out of 50.

