[project]
name = "paynaka"
version = "0.1.0"
description = "An authority-containment layer for money-moving AI agents, plus HAAT, its adversarial benchmark."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Satyam Singh" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    # Windows and slim Linux images ship no system tz database, and every
    # regulatory window in this project is expressed in Asia/Kolkata.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
agent = [
    "anthropic>=0.40",
    # OpenRouter is OpenAI-compatible, so one SDK reaches every model it fronts.
    "openai>=1.60",
    "mcp>=1.1",
    "razorpay>=1.4",
]
ml = [
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "freezegun>=1.5",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paynaka"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["paynaka", "merchant", "buyer", "haat", "chaos", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "S",             # bandit — security
    "DTZ",           # naive datetimes: a real bug class in a system with time-window rules
]
ignore = [
    "S101",   # assert is fine in tests
    "E501",   # line length is ruff-format's job
]

[tool.ruff.lint.isort]
known-first-party = ["paynaka", "merchant", "buyer", "haat", "chaos"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
# The adversarial suite carries homoglyph and invisible-character payloads on purpose.
# RUF001-003 flag exactly those, which is correct everywhere except here.
# RUF012 flags mutable class attributes. The stub response objects below are throwaway
# shapes standing in for SDK responses, not real classes with shared state.
"tests/adversarial/**" = ["S", "B011", "RUF001", "RUF002", "RUF003", "RUF012"]
"haat/attacks/**" = ["S"]
# tty.py holds a lookup table of exactly the characters a legacy codepage cannot print.
# RUF001 flags ambiguous characters, which is the rule working correctly on content whose
# entire purpose is to be that table.
"paynaka/tty.py" = ["RUF001"]
# build_corpus.py carries homoglyph and invisible-character payloads by design --
# they are the obfuscated_payload family. RUF001-003 flag exactly those.
"haat/build_corpus.py" = ["RUF001", "RUF002", "RUF003"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
namespace_packages = true
explicit_package_bases = true
exclude = ["^console/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["razorpay.*", "sse_starlette.*", "sklearn.*", "freezegun.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "adversarial: hostile-input and abuse-case tests",
    "integration: crosses a process or service boundary",
    "slow: takes more than a second",
    "needs_keys: requires real Razorpay/Anthropic credentials",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["paynaka"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
