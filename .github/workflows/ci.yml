name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dependencies
        # --all-extras, not --extra dev. The brain tests exercise the real OpenAI and
        # Anthropic SDK surfaces, so a dev-only environment fails them while a local
        # machine with everything installed passes. That divergence kept CI red for
        # several commits without anyone noticing, which is the whole argument for
        # having CI in the first place.
        run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types (strict)
        run: uv run mypy paynaka merchant haat chaos

      - name: Forward tests
        run: uv run pytest -m "not adversarial" --cov --cov-report=term-missing

      # Run adversarial tests as their own step so a hostile-input regression is
      # immediately legible in the CI log rather than buried in a combined run.
      - name: Adversarial tests
        run: uv run pytest -m adversarial

  console:
    name: console typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      # legacy-peer-deps comes from console/.npmrc: Blade is cross-platform, so a
      # web-only install still drags in the React Native peer graph.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history, not just the tip

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
