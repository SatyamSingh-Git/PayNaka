# PayNaka merchant policy.
#
# This file narrows what a mandate already permits; it can never widen it. The effective
# permission for any action is the intersection of the shopper's mandate and this file.
#
# Every key is validated at load time. An unknown key -- a typo like `max_amont` -- is a
# hard startup failure, never a silent fallback to an unbounded default.

version: 1
merchant: kirana-co

defaults:
  currency: INR
  require_idempotency_key: true

actions:
  create_order:
    max_amount: 500000        # Rs 5,000
    step_up_above: 200000     # Rs 2,000 -> human approval

  capture_payment:
    max_amount: 500000

  create_payment_link:
    max_amount: 200000

  # The action Razorpay switched off on their public MCP server. Enabled here, but only
  # behind a return event, a per-payment bound, a daily ceiling and a step-up band.
  create_refund:
    max_amount: 500000
    require_return_event: true
    step_up_above: 100000     # Rs 1,000
    daily_cap: 2000000        # Rs 20,000 across all refunds, per IST day

  # Payouts are not something a shopping agent has any business initiating.
  create_payout:
    enabled: false

regulatory:
  timezone: Asia/Kolkata
  # EXAMPLE VALUES, NOT VERIFIED. These are realistic defaults so the time-and-limit
  # machinery has something concrete to enforce. Every one of them has a narrower scope
  # than a flat number suggests, and none has been checked against a primary source by
  # this project. See docs/REGULATORY_BASIS.md before enabling any of them for real
  # money -- particularly afa_threshold and contact_window, which were previously
  # attributed to RBI more broadly than the source supports.
  npci_mandate_retries: 3          # example: retries per cycle. Varies by mandate type.
  debit_blackout: ["10:00-13:00"]  # example: an operational peak window, not statute
  contact_window: "08:00-19:00"    # example: RBI states this for RECOVERY AGENTS, not
                                   # general payment contact. Narrower than it looks.
  afa_threshold: 1500000           # example: AFA thresholds are CATEGORY-SPECIFIC and
                                   # have been revised. A flat number is not the rule.
  pre_debit_notice_seconds: 86400  # example: notice windows and products in scope must
                                   # be read off the current circular.

escalation:
  channel: console
  timeout_seconds: 300
  on_timeout: DENY          # fail closed. not configurable.

# Denial of wallet. A refusal costs PayNaka microseconds and costs whoever is driving the
# agent a full model turn, so an attacker who keeps an agent looping against a wall burns
# somebody else's budget for free. After this many refusals in an IST day the session's
# authority is withdrawn, which turns a retryable "no" into a terminal one.
#
# The subject bound is wider on purpose: an attacker who can burn one session can start
# another, and the shopper is the scope that does not reset.
#
# This bounds the attack; it does not prevent it. The turns before it trips are spent.
circuit_breaker:
  enabled: true
  denials_per_session: 12
  denials_per_subject: 40

kill_switch:
  revoke_all_mandates: false
